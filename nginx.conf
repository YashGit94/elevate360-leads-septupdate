server {
    listen 8080;
    server_name localhost;

    # This matches the location where files are copied in the Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # Requirement from your code: Redirect root to /siteops/
    location = / {
        return 301 /siteops/;
    }

    # Requirement from your code: Map /siteops/ to the root directory
    location /siteops/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Standard Angular SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
