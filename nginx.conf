server {
    listen 8888;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Requirement from your code: Redirect root to /siteops/
    location = / {
        return 301 /siteops/;
    }

    # Requirement from your code: Map /siteops/ to the root directory
    location /siteops/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Standard Angular SPA fallback for all other routes (login, dashboard, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
