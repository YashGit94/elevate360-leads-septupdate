server {
    listen 8888;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is critical for Angular routing to work without 404/Forbidden errors
        try_files $uri $uri/ /index.html;
    }

    # Optional: Ensure static assets are cached or served correctly
    location ~* \.(?:css|js|map|jpe?g|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}
