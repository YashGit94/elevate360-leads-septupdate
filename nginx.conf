server {
    # Match the port confirmed working in your environment
    listen 8888;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This maps the URL path "/siteops/" to the physical root folder
    location /siteops/ {
        alias /usr/share/nginx/html/;
        # Directs all sub-routes to index.html for Angular routing
        try_files $uri $uri/ /index.html;
    }

    # Redirects root traffic to the /siteops/ path automatically
    location = / {
        return 301 /siteops/;
    }

    # Standard fallback to ensure internal routes like /dashboard work
    location / {
        try_files $uri $uri/ /index.html;
    }
}
