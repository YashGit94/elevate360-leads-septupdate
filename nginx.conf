server {
    listen 8888;
    server_name localhost;
    
    # Absolute path to your compiled Angular files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # REMOVED $uri/ to prevent Nginx from trying to list the directory
        # This forces Nginx to either find the exact file or serve index.html
        try_files $uri /index.html;
    }

    # Specifically catch requests to the root
    location = / {
        try_files /index.html =404;
    }
}
